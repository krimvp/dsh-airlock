# The e2e profile's own patch layer, copied into
# $DSH_HOME/profiles/<profile>/cordis.patch.yml by verify.sh.
#
# It changes two rows of the stock headless composition and nothing else:
# the LLM route and the default model. `apiKeyEnv` is a credential reference,
# so no secret enters this file.

- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Ollama Cloud
        apiKeyEnv: OLLAMA_API_KEY
        api: openai-completions
        baseURL: https://ollama.com/v1
        models:
          - id: !!js process.env.E2E_MODEL
            contextWindow: 131072
            maxTokens: 8192

- id: agent-default-model
  config:
    provider: ollama
    model: !!js process.env.E2E_MODEL
